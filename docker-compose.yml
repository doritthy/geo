version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: subsurface
      POSTGRES_PASSWORD: subsurface
      POSTGRES_DB: subsurface
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./infra/db/twin.sql:/docker-entrypoint-initdb.d/02-twin.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subsurface"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: subsurface
      MINIO_ROOT_PASSWORD: subsurface123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 subsurface subsurface123 &&
      mc mb -p local/subsurface-data || true &&
      exit 0
      "

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://subsurface:subsurface@postgres:5432/subsurface
      JWT_SECRET: change-me-in-production
      JWT_EXPIRE_MINUTES: "1440"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: subsurface
      S3_SECRET_KEY: subsurface123
      S3_BUCKET: subsurface-data
      CORS_ORIGINS: http://localhost:3000
      # Conversions / analyses run in the separate `worker` service.
      JOB_MODE: queue
      # Autodesk Platform Services (optional): ACC/BIM 360 import, RVT -> IFC
      APS_CLIENT_ID: ${APS_CLIENT_ID:-}
      APS_CLIENT_SECRET: ${APS_CLIENT_SECRET:-}
      APS_CALLBACK_URL: ${APS_CALLBACK_URL:-http://localhost:8000/api/integrations/autodesk/callback}
      APS_WEBHOOK_URL: ${APS_WEBHOOK_URL:-}
      APS_WEBHOOK_SECRET: ${APS_WEBHOOK_SECRET:-}
      PUBLIC_WEB_URL: http://localhost:3000
      # Issue notifications (optional): email via SMTP, Web Push via VAPID
      # (generate keys: docker compose run --rm api python -m app.push)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-twin@localhost}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:twin@localhost}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app

  # Background worker: file conversion to 3D Tiles, deviation/ICP analyses,
  # ACC imports. Scale with `docker compose up --scale worker=3`.
  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://subsurface:subsurface@postgres:5432/subsurface
      JWT_SECRET: change-me-in-production
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: subsurface
      S3_SECRET_KEY: subsurface123
      S3_BUCKET: subsurface-data
      JOB_MODE: queue
      APS_CLIENT_ID: ${APS_CLIENT_ID:-}
      APS_CLIENT_SECRET: ${APS_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
    volumes:
      - ./apps/api:/app

  # IoT: MQTT broker for site gateways + bridge into the platform
  # (topic twin/sensors/<sensor id>, payload {"token", "value", "ts"}).
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  iot-bridge:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.iot_mqtt"]
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://subsurface:subsurface@postgres:5432/subsurface
      JWT_SECRET: change-me-in-production
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: subsurface
      S3_SECRET_KEY: subsurface123
      S3_BUCKET: subsurface-data
      PUBLIC_WEB_URL: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Optional: Cesium ion token for world terrain (otherwise a flat ground
      # at the project's site level is used).
      NEXT_PUBLIC_CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
      - /app/public/cesium

volumes:
  pgdata:
  minio-data:
