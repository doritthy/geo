# MQTT broker for site IoT gateways. Every message is authenticated by the
# per-sensor ingest token inside the payload (checked by app.iot_mqtt), so the
# broker itself allows anonymous clients here. For production, enable
# password_file / TLS (listener 8883) and pass MQTT_USERNAME / MQTT_PASSWORD
# to the iot-bridge service.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
