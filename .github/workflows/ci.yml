name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: subsurface
          POSTGRES_PASSWORD: subsurface
          POSTGRES_DB: subsurface
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U subsurface" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client fonts-dejavu-core libgomp1
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests (real Postgres + S3 via moto)
        env:
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_PORT: "5432"
          TEST_PG_USER: subsurface
          TEST_PG_PASSWORD: subsurface
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
